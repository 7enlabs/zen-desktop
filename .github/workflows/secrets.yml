name: Secrets

# Secret scan gate copied from the proven template in 7enlabs/zencode
# (.github/workflows/ci.yml, job "secrets" on main 060b2d3, 2026-11-07):
# gitleaks pinned by version + sha256, full history, redacted SARIF report.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan on main (Mondays 03:17 UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (matches the release
      # gitleaks_8.30.1_checksums.txt). Bump both lines together.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Gitleaks (full history, redacted)
        shell: bash
        run: |
          umask 077
          ./gitleaks git --redact --no-banner --exit-code 1 -f sarif -r gitleaks.sarif .
      - name: Upload redacted report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7
