[package]
name = "zencode_engine"
version = "0.3.0-dev"
edition = "2021"
license = "MIT"
description = "ZenCode Desktop engine: runs the ZenCode CLI as a subprocess (zen -p --output-format stream-json) and observes its event stream"

[dependencies]
anyhow = "1"
libc = "0.2"
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0
